[package]
name = "clearscope-core"
version = "1.1.0"
edition = "2021"
description = "Fast disk usage scanning engine (NTFS MFT reader + parallel walker + USN live updates)"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
lz4_flex = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }
