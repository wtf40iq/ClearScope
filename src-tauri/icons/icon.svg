<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a93ff"/><stop offset="1" stop-color="#2553d4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6ecfa"/>
    </linearGradient>
    <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8cf6"/><stop offset="1" stop-color="#3566e0"/></linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3cc6aa"/><stop offset="1" stop-color="#1c9f86"/></linearGradient>
    <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8c45a"/><stop offset="1" stop-color="#e9a32e"/></linearGradient>
    <linearGradient id="gD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4836f"/><stop offset="1" stop-color="#e05b47"/></linearGradient>
    <linearGradient id="gE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3bdd6"/><stop offset="1" stop-color="#8f9bba"/></linearGradient>
    <linearGradient id="gF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a48cf0"/><stop offset="1" stop-color="#7d63dc"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3f78"/><stop offset="1" stop-color="#0f1d45"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33498a"/><stop offset="1" stop-color="#101c40"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0a1a55" flood-opacity=".35"/>
    </filter>
    <clipPath id="lensClip"><circle cx="690" cy="680" r="150"/></clipPath>
    <g id="blocks">
      <rect x="224" y="236" width="260" height="488" rx="30" fill="url(#gA)"/>
      <rect x="248" y="548" width="100" height="152" rx="16" fill="#fff" fill-opacity=".18"/>
      <rect x="360" y="548" width="100" height="70" rx="14" fill="#fff" fill-opacity=".12"/>
      <rect x="360" y="630" width="100" height="70" rx="14" fill="#fff" fill-opacity=".08"/>
      <rect x="508" y="236" width="204" height="228" rx="30" fill="url(#gB)"/>
      <rect x="508" y="488" width="204" height="100" rx="24" fill="url(#gC)"/>
      <rect x="508" y="612" width="96" height="112" rx="20" fill="url(#gD)"/>
      <rect x="616" y="612" width="96" height="50" rx="14" fill="url(#gF)"/>
      <rect x="616" y="674" width="44" height="50" rx="12" fill="url(#gB)"/>
      <rect x="668" y="674" width="44" height="22" rx="8" fill="url(#gC)"/>
      <rect x="668" y="702" width="44" height="22" rx="8" fill="url(#gE)"/>
    </g>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#sheen)"/>
  <rect x="66" y="66" width="892" height="892" rx="206" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="4"/>

  <rect x="188" y="200" width="560" height="560" rx="64" fill="url(#panel)" filter="url(#sh)"/>
  <use href="#blocks"/>

  <!-- magnifier -->
  <g filter="url(#sh)">
    <line x1="806" y1="796" x2="880" y2="870" stroke="url(#handle)" stroke-width="78" stroke-linecap="round"/>
    <circle cx="690" cy="680" r="172" fill="#fff"/>
  </g>
  <g clip-path="url(#lensClip)">
    <rect x="500" y="490" width="380" height="380" fill="#fbfcff"/>
    <g transform="translate(690 680) scale(1.75) translate(-664 -668)"><use href="#blocks"/></g>
    <path d="M560 600 A150 150 0 0 1 700 532" stroke="#fff" stroke-opacity=".75" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="690" cy="680" r="150" fill="#cfe0ff" fill-opacity=".12"/>
  </g>
  <circle cx="690" cy="680" r="161" fill="none" stroke="url(#ring)" stroke-width="40"/>
  <circle cx="690" cy="680" r="142" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>
  <path d="M600 548 A161 161 0 0 1 760 534" stroke="#fff" stroke-opacity=".28" stroke-width="10" stroke-linecap="round" fill="none"/>
  <line x1="826" y1="816" x2="868" y2="858" stroke="#fff" stroke-opacity=".22" stroke-width="14" stroke-linecap="round"/>
</svg>
